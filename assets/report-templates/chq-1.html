<div class="cheque-print chq-1">
  <p class="cheque-bank">{{bankName}}{{branchName}}</p>
  <p class="cheque-date">Date: {{chequeDate}}</p>
  <p class="cheque-no">Cheque No: {{chequeNo}}</p>
  <p class="cheque-payee"><strong>Pay:</strong> {{payee}}</p>
  <p class="cheque-amount-words"><strong>Rupees:</strong> {{amountWords}}</p>
  <p class="cheque-amount-figures"><strong>₹</strong> {{amount}}</p>
  <div class="cheque-signatories">
    <p>{{signatory1}}</p>
    <p>{{signatory2}}</p>
  </div>
</div>
